<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #f8fafc;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }

      /* Dynamic Animations (Kept in background & periphery so text remains crisp and unobstructed) */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatDevice1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
      }
      @keyframes floatDevice2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1.5deg); }
      }
      @keyframes signalFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .animated-glow-1 {
        transform-origin: 1050px 90px;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .animated-glow-2 {
        transform-origin: 150px 300px;
        animation: pulseGlow 8s ease-in-out infinite alternate;
      }
      .device-card-1 {
        animation: floatDevice1 5s ease-in-out infinite;
      }
      .device-card-2 {
        animation: floatDevice2 6.5s ease-in-out infinite;
      }
      .signal-line {
        stroke-dasharray: 8 6;
        animation: signalFlow 2.5s linear infinite;
      }
      .radar-arm {
        transform-origin: 1060px 180px;
        animation: radarSweep 10s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- Ambient Dynamic Glows (Behind all content) -->
  <circle class="animated-glow-1" cx="1050" cy="90" r="170" fill="#38bdf8" opacity="0.3" filter="url(#glow)" />
  <circle class="animated-glow-2" cx="150" cy="300" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" />

  <!-- Connecting Telemetry Line (Animated) -->
  <path class="signal-line" d="M 520 225 Q 750 250 910 180 T 1060 180" fill="none" stroke="#38bdf8" stroke-width="2.2" opacity="0.45" />

  <!-- Background Decorative Fleet Radar Graphic on Right Side -->
  <g opacity="0.6">
    <circle cx="1060" cy="180" r="110" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle cx="1060" cy="180" r="75" fill="none" stroke="#475569" stroke-width="1.5" />
    <circle cx="1060" cy="180" r="40" fill="none" stroke="#64748b" stroke-width="1.5" />
    <circle cx="1060" cy="180" r="5" fill="#38bdf8" />
    
    <!-- Rotating Radar Line -->
    <line class="radar-arm" x1="1060" y1="180" x2="1060" y2="70" stroke="url(#accentBlue)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Floating Dynamic Device Card 1 (Laptop / macOS / Windows) -->
  <g class="device-card-1" transform="translate(860, 70)">
    <rect width="160" height="95" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
    <!-- Screen Header -->
    <rect x="12" y="12" width="136" height="14" rx="4" fill="#334155" opacity="0.6" />
    <circle cx="20" cy="19" r="3" fill="#ef4444" />
    <circle cx="29" cy="19" r="3" fill="#eab308" />
    <circle cx="38" cy="19" r="3" fill="#22c55e" />
    <!-- Metrics -->
    <rect x="12" y="34" width="70" height="8" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="12" y="48" width="110" height="6" rx="3" fill="#64748b" opacity="0.7" />
    <rect x="12" y="60" width="85" height="6" rx="3" fill="#64748b" opacity="0.5" />
    <!-- Status Pill -->
    <rect x="95" y="72" width="53" height="14" rx="7" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="0.8" />
    <text x="121" y="82" font-family="sans-serif" font-size="9" fill="#4ade80" font-weight="700" text-anchor="middle">ENROLLED</text>
  </g>

  <!-- Floating Dynamic Device Card 2 (Mobile / Android / iOS) -->
  <g class="device-card-2" transform="translate(970, 185)">
    <rect width="105" height="140" rx="14" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.7" filter="url(#glow)" />
    <!-- Speaker & Camera -->
    <rect x="42" y="8" width="22" height="3" rx="1.5" fill="#475569" />
    <circle cx="70" cy="9.5" r="2" fill="#38bdf8" />
    <!-- Screen content -->
    <rect x="10" y="20" width="85" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="52" y="37" font-family="sans-serif" font-size="9" fill="#93c5fd" font-weight="600" text-anchor="middle">MDM SECURE</text>
    <rect x="10" y="56" width="85" height="5" rx="2.5" fill="#475569" opacity="0.6" />
    <rect x="10" y="67" width="65" height="5" rx="2.5" fill="#475569" opacity="0.4" />
    <rect x="10" y="78" width="75" height="5" rx="2.5" fill="#475569" opacity="0.4" />
    <!-- Lock Shield Icon -->
    <circle cx="52" cy="110" r="14" fill="#3b82f6" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <path d="M 48 109 L 52 105 L 56 109 L 56 114 L 48 114 Z" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed completely clear, legible and in front -->
  <g transform="translate(70, 75)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8" />
      <text x="32" y="19" class="badge-text">ENTERPRISE FLEET &amp; MDM / UEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" class="title-text">Awesome Mobile Device Fleet Management</text>

    <!-- Subtitle -->
    <text x="0" y="112" class="subtitle-text">Curated SaaS UEM &amp; Open-Source MDM Platforms for Android, iOS, macOS &amp; Windows</text>

    <!-- Interactive / Highlighting Feature Pills -->
    <g transform="translate(0, 142)">
      <!-- Pill 1: Cross-Platform -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="65" y="22" class="pill-text" text-anchor="middle">📱 iOS &amp; Android</text>
      </g>
      <!-- Pill 2: Desktop Endpoints -->
      <g transform="translate(142, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="72" y="22" class="pill-text" text-anchor="middle">💻 macOS &amp; Win</text>
      </g>
      <!-- Pill 3: GitOps & Security -->
      <g transform="translate(299, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="72" y="22" class="pill-text" text-anchor="middle">🔒 Zero-Trust MDM</text>
      </g>
      <!-- Pill 4: Open Source -->
      <g transform="translate(456, 0)">
        <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <text x="70" y="22" class="pill-text" fill="#38bdf8" text-anchor="middle">⚡ Open-Source</text>
      </g>
    </g>
  </g>
</svg>
