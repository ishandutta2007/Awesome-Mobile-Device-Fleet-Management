<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>

    <!-- Title & Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic / Animated Background Wave Elements (Background Layer) -->
  <g opacity="0.25">
    <path d="M 0,160 Q 300,80 600,160 T 1200,160 L 1200,320 L 0,320 Z" fill="#0284c7">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M 0,160 Q 300,80 600,160 T 1200,160 L 1200,320 L 0,320 Z;
                M 0,180 Q 300,240 600,140 T 1200,180 L 1200,320 L 0,320 Z;
                M 0,160 Q 300,80 600,160 T 1200,160 L 1200,320 L 0,320 Z"/>
    </path>
    <path d="M 0,200 Q 400,280 800,180 T 1200,220 L 1200,320 L 0,320 Z" fill="#6366f1">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M 0,200 Q 400,280 800,180 T 1200,220 L 1200,320 L 0,320 Z;
                M 0,150 Q 400,100 800,220 T 1200,170 L 1200,320 L 0,320 Z;
                M 0,200 Q 400,280 800,180 T 1200,220 L 1200,320 L 0,320 Z"/>
    </path>
  </g>

  <!-- Grid Pattern Overlay for Tech feel -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1100" y1="0" x2="1100" y2="320"/>
  </g>

  <!-- Animated Radar Pulse Rings (Right Peripheral Background) -->
  <g transform="translate(1040, 160)" opacity="0.75">
    <circle r="75" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="50;95;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="45" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle r="6" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Floating Dynamic Device Card 1 (Laptop / macOS / Windows) -->
  <g transform="translate(860, 60)">
    <animateTransform attributeName="transform" type="translate"
      values="860,60; 860,50; 860,60" dur="5s" repeatCount="indefinite" />
    <rect width="165" height="95" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" filter="url(#glow)"/>
    <rect x="12" y="12" width="141" height="14" rx="4" fill="#334155" opacity="0.6" />
    <circle cx="20" cy="19" r="3" fill="#ef4444" />
    <circle cx="29" cy="19" r="3" fill="#eab308" />
    <circle cx="38" cy="19" r="3" fill="#22c55e" />
    <rect x="12" y="36" width="70" height="7" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="12" y="49" width="115" height="6" rx="3" fill="#64748b" opacity="0.7" />
    <rect x="12" y="61" width="90" height="6" rx="3" fill="#64748b" opacity="0.5" />
    <rect x="100" y="72" width="53" height="15" rx="7.5" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="0.8" />
    <text x="126" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#4ade80" font-weight="700" text-anchor="middle">ENROLLED</text>
  </g>

  <!-- Floating Dynamic Device Card 2 (Mobile / Android / iOS) -->
  <g transform="translate(980, 160)">
    <animateTransform attributeName="transform" type="translate"
      values="980,160; 980,170; 980,160" dur="6s" repeatCount="indefinite" />
    <rect width="105" height="135" rx="14" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.8" filter="url(#glow)"/>
    <rect x="42" y="8" width="22" height="3" rx="1.5" fill="#475569" />
    <circle cx="70" cy="9.5" r="2" fill="#38bdf8" />
    <rect x="10" y="18" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="52" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#93c5fd" font-weight="600" text-anchor="middle">MDM SECURE</text>
    <rect x="10" y="52" width="85" height="5" rx="2.5" fill="#475569" opacity="0.6" />
    <rect x="10" y="63" width="65" height="5" rx="2.5" fill="#475569" opacity="0.4" />
    <rect x="10" y="74" width="75" height="5" rx="2.5" fill="#475569" opacity="0.4" />
    <circle cx="52" cy="105" r="13" fill="#3b82f6" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <path d="M 48 104 L 52 100 L 56 104 L 56 109 L 48 109 Z" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND CONTENT: Completely legible, unobstructed and in front -->
  <g transform="translate(70, 0)">
    <!-- Badge Pill -->
    <g transform="translate(0, 45)">
      <rect width="250" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="15" cy="14" r="5" fill="#38bdf8"/>
      <text x="135" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ENTERPRISE FLEET &amp; UEM / MDM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="120" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Mobile Device Fleet Management</text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Curated SaaS UEM &amp; Open-Source MDM Platforms for Android, iOS, macOS &amp; Windows</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="32" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#475569"/>
      <text x="72" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📱 iOS &amp; Android</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="155" height="32" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#475569"/>
      <text x="232" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">💻 macOS &amp; Windows</text>

      <!-- Pill 3 -->
      <rect x="320" y="0" width="155" height="32" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#475569"/>
      <text x="397" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔒 Zero-Trust MDM</text>

      <!-- Pill 4 -->
      <rect x="485" y="0" width="145" height="32" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="557" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Open-Source</text>
    </g>
  </g>
</svg>
